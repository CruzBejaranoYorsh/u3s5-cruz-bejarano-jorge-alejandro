<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Servicios{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input, textarea, select { border: 1px solid #94a3b8; border-radius: .5rem; padding: .4rem .6rem; width: 100%; }
    label { display: block; font-weight: 600; margin-bottom: .2rem; }
    .errorlist { color: #dc2626; font-size: .9rem; }
    .helptext { color: #64748b; font-size: .8rem; display: block; }
  </style>
</head>
<body class="max-w-2xl mx-auto py-10 px-6 bg-white text-slate-900">
  <nav class="flex justify-end items-center gap-4 mb-6 text-sm">
    {% if user.is_authenticated %}
      <span>Hola, <b>{{ user.username }}</b></span>
      <a href="{% url 'logout' %}" class="text-blue-600 underline">Cerrar sesión</a>
    {% else %}
      <a href="{% url 'login' %}" class="text-blue-600 underline">Iniciar sesión</a>
      <a href="{% url 'registro' %}" class="text-blue-600 underline">Crear cuenta</a>
    {% endif %}
  </nav>

  {% for message in messages %}
    <div class="bg-emerald-100 text-emerald-800 px-4 py-2 rounded-lg mb-4">{{ message }}</div>
  {% endfor %}

  {% block contenido %}{% endblock %}
</body>
</html>
