{% extends 'core/base.html' %}

{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
  <div class="flex justify-center">
    <div class="bg-white shadow-md rounded-xl p-8 w-full max-w-sm border border-slate-200">
      <h1 class="text-2xl font-bold mb-6">Crear cuenta</h1>
      <form method="POST" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg">
          Registrarme
        </button>
      </form>
      <p class="mt-4 text-sm">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-blue-600 underline">Inicia sesión</a></p>
    </div>
  </div>
{% endblock %}
