<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Servicios</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="max-w-2xl mx-auto py-10 px-6">
  <h1 class="text-2xl font-bold mb-6">Servicios</h1>

  <table class="w-full border border-slate-200 rounded-lg overflow-hidden">
    <thead class="bg-slate-100">
      <tr>
        <th class="text-left px-4 py-2">Servicio</th>
        <th class="text-left px-4 py-2">Precio</th>
      </tr>
    </thead>
    <tbody>
      {% for servicio in servicios %}
        <tr class="border-t border-slate-200">
          <td class="px-4 py-2">{{ servicio.titulo }}</td>
          <td class="px-4 py-2">${{ servicio.precio }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
